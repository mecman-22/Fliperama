<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coletor Estelar</title>
<style>
  html, body { margin: 0; height: 100%; background: #070712; overflow: hidden; font-family: system-ui, sans-serif; color: #fff; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #hud { position: fixed; top: 10px; left: 14px; font-weight: 700; font-size: 18px; pointer-events: none; text-shadow: 0 2px 4px #000; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(7,7,18,.7); }
  #overlay h1 { margin: 0 0 8px; font-size: 36px; }
  #overlay p { margin: 4px 0; color: #b9b6dd; }
  button { margin-top: 16px; background: #7c5cff; color: #fff; border: 0; border-radius: 10px; padding: 12px 24px; font-size: 18px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="overlay">
  <div>
    <h1>🚀 Coletor Estelar</h1>
    <p>Colete ⭐ e desvie dos asteroides.</p>
    <p>Setas / WASD — ou arraste com o dedo.</p>
    <p id="best"></p>
    <button id="start">Começar</button>
  </div>
</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hud = document.getElementById('hud'), overlay = document.getElementById('overlay');
let W, H, dpr;
function resize() {
  dpr = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize); resize();

let best = 0;
try { best = +localStorage.getItem('coletor-best') || 0; } catch (e) {}
const showBest = () => document.getElementById('best').textContent = best ? 'Recorde: ' + best : '';
showBest();

const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
let touch = null;
cv.addEventListener('pointerdown', e => touch = { x: e.clientX, y: e.clientY });
cv.addEventListener('pointermove', e => { if (touch) touch = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => touch = null);

const bg = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), s: Math.random() * 1.5 + .3 }));
let ship, stars, rocks, particles, score, lives, t, running = false, last = 0, spawnR, spawnS, inv;

function reset() {
  ship = { x: W / 2, y: H * .75, r: 14 };
  stars = []; rocks = []; particles = [];
  score = 0; lives = 3; t = 0; spawnR = 0; spawnS = 0; inv = 0;
}

function burst(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * 220 + 60;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: .6, color });
  }
}

function update(dt) {
  t += dt;
  const sp = 340;
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx--;
  if (keys['arrowright'] || keys['d']) dx++;
  if (keys['arrowup'] || keys['w']) dy--;
  if (keys['arrowdown'] || keys['s']) dy++;
  ship.x += dx * sp * dt; ship.y += dy * sp * dt;
  if (touch) { ship.x += (touch.x - ship.x) * Math.min(1, dt * 10); ship.y += (touch.y - 40 - ship.y) * Math.min(1, dt * 10); }
  ship.x = Math.max(ship.r, Math.min(W - ship.r, ship.x));
  ship.y = Math.max(ship.r, Math.min(H - ship.r, ship.y));

  const diff = 1 + t / 30;
  spawnR -= dt; spawnS -= dt;
  if (spawnR <= 0) {
    spawnR = Math.max(.18, .9 / diff);
    const r = 12 + Math.random() * 22;
    rocks.push({ x: Math.random() * W, y: -r, r, vy: (120 + Math.random() * 120) * diff, vx: (Math.random() - .5) * 80, rot: 0, vr: (Math.random() - .5) * 3 });
  }
  if (spawnS <= 0) {
    spawnS = .8 + Math.random() * .6;
    stars.push({ x: 20 + Math.random() * (W - 40), y: -10, vy: 110 + Math.random() * 60, ph: Math.random() * 6 });
  }
  for (const r of rocks) { r.y += r.vy * dt; r.x += r.vx * dt; r.rot += r.vr * dt; }
  for (const s of stars) { s.y += s.vy * dt; s.ph += dt * 5; }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  inv = Math.max(0, inv - dt);

  stars = stars.filter(s => {
    if (Math.hypot(s.x - ship.x, s.y - ship.y) < ship.r + 12) { score += 10; burst(s.x, s.y, '#ffd84a'); return false; }
    return s.y < H + 20;
  });
  rocks = rocks.filter(r => {
    if (!inv && Math.hypot(r.x - ship.x, r.y - ship.y) < ship.r + r.r * .8) {
      lives--; inv = 1.5; burst(ship.x, ship.y, '#ff5d5d', 24);
      if (lives <= 0) gameOver();
      return false;
    }
    return r.y < H + r.r + 10;
  });
  particles = particles.filter(p => p.life > 0);
  score += dt * 2;
}

function draw() {
  ctx.fillStyle = '#070712'; ctx.fillRect(0, 0, W, H);
  for (const s of bg) {
    const y = (s.y * H + t * 30 * s.s) % H;
    ctx.fillStyle = `rgba(255,255,255,${.25 + s.s * .3})`;
    ctx.fillRect(s.x * W, y, s.s, s.s);
  }
  for (const s of stars) {
    const k = 1 + Math.sin(s.ph) * .15;
    ctx.save(); ctx.translate(s.x, s.y); ctx.scale(k, k);
    ctx.fillStyle = '#ffd84a'; ctx.shadowColor = '#ffd84a'; ctx.shadowBlur = 14;
    ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? 5 : 12; ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.fill(); ctx.restore();
  }
  for (const r of rocks) {
    ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
    ctx.fillStyle = '#6b5f7a'; ctx.strokeStyle = '#9d8fb0'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = r.r * (i % 2 ? .82 : 1); ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
  }
  for (const p of particles) { ctx.globalAlpha = p.life / .6; ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  if (running && !(inv && Math.floor(inv * 10) % 2)) {
    ctx.save(); ctx.translate(ship.x, ship.y);
    ctx.fillStyle = '#ff8a3d'; ctx.beginPath(); ctx.moveTo(-6, 12); ctx.lineTo(0, 22 + Math.random() * 8); ctx.lineTo(6, 12); ctx.fill();
    ctx.fillStyle = '#c9c2ff'; ctx.shadowColor = '#7c5cff'; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.moveTo(0, -18); ctx.lineTo(14, 14); ctx.lineTo(0, 8); ctx.lineTo(-14, 14); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
  hud.textContent = running ? `⭐ ${Math.floor(score)}   ${'❤️'.repeat(lives)}` : '';
}

function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (running) update(dt); else t += dt;
  draw();
  requestAnimationFrame(loop);
}

function gameOver() {
  running = false;
  const s = Math.floor(score);
  if (s > best) { best = s; try { localStorage.setItem('coletor-best', best); } catch (e) {} }
  overlay.querySelector('h1').textContent = 'Fim de jogo!';
  overlay.querySelector('p').textContent = 'Pontuação: ' + s;
  document.getElementById('start').textContent = 'Jogar de novo';
  showBest();
  overlay.style.display = 'grid';
}

document.getElementById('start').onclick = () => { reset(); running = true; overlay.style.display = 'none'; };
reset();
requestAnimationFrame(t0 => { last = t0; loop(t0); });
</script>
</body>
</html>
